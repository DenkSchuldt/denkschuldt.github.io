name: Deploy both portfolio versions to GitHub Pages

on:
  push:
    branches:
      - master
      - revamp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Check out revamp
        uses: actions/checkout@v4
        with:
          ref: revamp
          path: revamp

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            master/package-lock.json
            revamp/package-lock.json

      - name: Build master site
        working-directory: master
        run: |
          npm ci
          npm run build

      - name: Build hidden revamp
        working-directory: revamp
        env:
          GITHUB_PAGES_BASE_PATH: /hidden
          NEXT_PUBLIC_BASE_PATH: /hidden
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/hidden
          cp -R master/dist/. site/
          cp -R revamp/dist/client/. site/hidden/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
